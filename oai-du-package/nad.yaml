apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: du-ran-f1
  namespace: oai-ran-du
  annotations:
    argocd.argoproj.io/sync-wave: "1"   
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "du-ran-f1",
      "plugins": [
        {
          "type": "ipvlan",
          "capabilities": {
            "ips": true
          },
          "master": "DU_F1U_MULTUSPARENTINTERFACE",
          "mode": "l2",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }            